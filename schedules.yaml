# Lịch chạy định kỳ của Ultron.
#
# Sửa FILE NÀY thay vì tạo cron job mới. Dispatcher `daily_dispatch.py` tự tick mỗi 2 phút
# (cron job duy nhất: `ultron-daily`) và chỉ chạy đúng việc tới giờ.
#
# Trường dùng được cho mỗi action:
#   id        (bắt buộc)  tên duy nhất
#   when      "HH:MM"     giờ chạy trong ngày
#   script                tên script trong ~/.hermes/scripts/ (hoặc đường dẫn tuyệt đối)
#   args      [..]        tham số truyền cho script
#   enabled   true/false  tắt tạm mà không cần xoá
#   days      [mon,tue,..] chỉ chạy những thứ này (bỏ trống = mỗi ngày)
#   date      "YYYY-MM-DD"  one-shot: CHỈ chạy đúng ngày này (tự hết hạn, không thành rác)
#   until     "YYYY-MM-DD"  tự hết hạn sau ngày này
#   retry     N           số lần thử lại trong ngày nếu lỗi (mặc định 1); lỗi chỉ báo 1 lần/ngày
#   catch_up_minutes  N   nếu gateway down lúc tới giờ, còn trong N phút thì vẫn chạy (mặc định 120)
#
# Xem lịch:      venv/bin/python ~/.hermes/scripts/daily_dispatch.py --list
# Chạy thử:      ... daily_dispatch.py --dry-run
# Chạy ngay 1:   ... daily_dispatch.py --run <id>
#
# LƯU Ý: chỉ chuyển được việc thuần script vào đây. Việc cần session LLM (đọc/nghĩ/sinh nội dung,
# vd nhắc task Jira) vẫn phải là cron job thật vì dispatcher không chạy được LLM.

actions:
  # Chào team buổi sáng — one-shot ngày 11/09/2026 (Hoàng nghỉ), tự hết hạn sau ngày đó.
  # Có @mention team Tester (đọc từ sổ hồ sơ theo tag tester+vbsme).
  - id: morning-greeting
    when: "08:30"
    date: "2026-09-11"
    script: group_greeting.py
    args: ["--space", "spaces/AAAADv4ib6s"]

  # Snapshot tài nguyên máy mỗi sáng (chuyển từ cron job `daily-resource-check`, 2026-09-10).
  - id: resource-check
    when: "09:00"
    script: resource_snapshot.py

  # Nhắc ăn trưa — ngày làm việc, 12h. Nội dung xoay vòng theo ngày; không @mention ai.
  - id: lunch-reminder
    when: "12:00"
    days: [mon, tue, wed, thu, fri]
    script: team_post.py
    args: ["--kind", "lunch", "--space", "spaces/AAAADv4ib6s"]

  # Khai ca chiều — ngày làm việc, 13h. Nội dung xoay vòng theo ngày; không @mention ai.
  # (Hoàng yêu cầu 2026-09-11: "13h mọi người ngủ dậy vào ca chiều, lên tạo không khí làm việc")
  - id: afternoon-kickoff
    when: "13:00"
    days: [mon, tue, wed, thu, fri]
    script: team_post.py
    args: ["--kind", "afternoon", "--space", "spaces/AAAADv4ib6s"]

  # Rà bài học dài hạn lỗi thời — Chủ nhật 09:00. 0 token: lesson_review.py chỉ SOI và BÁO
  # (bài rác / bài trùng / tiền đề đã đổi), KHÔNG tự xoá. Có phát hiện → ghi escalation về DM Hoàng.
  - id: lesson-review
    when: "09:00"
    days: [sun]
    script: lesson_review.py

  # Cổng kiểm hạn "thẻ nghiệp vụ" (vbsme) — mỗi ngày 08:00. 0 token: script tự chạy
  # `bizcard.py check --fetch` trên nhánh dev-sit, CHỈ nhắn DM Hoàng khi có thẻ lệch cứng
  # hoặc vùng theo dõi có commit nghi ngờ (fix/bugfix/hotfix). Thẻ = context khởi đầu để vào
  # đúng vùng/API (Hoàng chốt 15/09), KHÔNG thay việc kiểm chứng.
  - id: bizcard-gate
    when: "08:00"
    script: bizcard_gate.py

  # Bản tin email sáng cho Hoàng — 08:00 ngày làm việc, gửi vào DM riêng.
  # Lọc bot JIRA/bản tin/đào tạo, chỉ liệt kê mail NGƯỜI gửi; im lặng nếu không có gì mới.
  # Bản tin email sáng — TẮT 2026-09-12: Hoàng chốt chỉ cần theo dõi + ping mail QUAN TRỌNG
  # (email_watch.py + cron ultron-email-watch), không cần bản tin toàn bộ mail.
  # Bật lại: đổi enabled -> true (hoặc nhắn Ultron).
  - id: email-digest
    enabled: false
    when: "08:00"
    days: [mon, tue, wed, thu, fri]
    script: email_digest.py
    args: ["--send"]

  # Lời chào cuối ngày — ngày làm việc, 17h30. Nội dung xoay vòng theo ngày; không @mention ai.
  - id: evening-greeting
    when: "17:30"
    days: [mon, tue, wed, thu, fri]
    script: team_post.py
    args: ["--kind", "evening", "--space", "spaces/AAAADv4ib6s"]

  # TẮT MỌI KẾT NỐI TAILSCALE sau 17h30 — luật chung, chạy MỖI NGÀY (Hoàng chốt 2026-09-12:
  # "Chú ý tất cả các kết nối tailscale đều phải tắt sau 17h30 nhé" + "Và phải xoá log
  # talescale trên hệ thống"). Node vbsme-log-gw (đường tester đọc log + cổng Siri bridge)
  # phải chết sau giờ làm, không để lại dấu vết qua đêm.
  # Script: logout node + stop/rm container + xoá volume state + XOÁ LOG tailscale
  # (log container, file log tên 'tailscale' ở /tmp và ~/.hermes) rồi DM báo Hoàng.
  # Chạy lại nhiều lần vô hại. Muốn mở lại ban ngày: nhắn Ultron (không tự bật).
  - id: tailscale-teardown
    when: "17:30"
    script: tailscale_teardown.py

  # NGOẠI LỆ 2026-09-12: Hoàng yêu cầu mở lại Tailscale + cổng Siri tới 22h tối nay.
  # Action 17:30 ở trên đã chạy xong hôm nay (state ok) nên không tự chạy lại; one-shot dưới
  # dọn đúng 22:00 tối nay rồi tự hết hạn → mai lịch 17:30 lại bình thường.
  - id: tailscale-teardown-2200
    when: "22:00"
    date: "2026-09-12"
    script: tailscale_teardown.py

  # Nhắc Hoàng ca GD treo "chờ tra soát" nhưng lõi đã trả mã core banking (tester Như báo 12/09;
  # Hoàng dặn note lại để thứ 2 14/09 kiểm tra). One-shot → tự hết hạn sau ngày đó.
  # DM riêng cho Hoàng (spaces/0dniIqAAAAE), nội dung soạn sẵn trong ~/.hermes/reminders/.
  - id: napas-treo-corebanking-remind
    when: "09:00"
    date: "2026-09-14"
    script: gchat_send_text.py
    args: ["--space", "spaces/0dniIqAAAAE", "--text-file", "/home/zane/.hermes/reminders/20260914-napas-treo-corebanking.txt"]

  # Nhắc lại lần 2 cùng ca trên nếu thứ 2 chưa xử lý xong (chiều thứ 2 14/09).
  - id: napas-treo-corebanking-remind-2
    when: "15:00"
    date: "2026-09-14"
    script: gchat_send_text.py
    args: ["--space", "spaces/0dniIqAAAAE", "--text-file", "/home/zane/.hermes/reminders/20260914-napas-treo-corebanking.txt"]

  # Báo cáo tiến độ công việc nền cho Hoàng, mỗi 15 phút (Hoàng yêu cầu 2026-09-13:
  # "Báo cáo anh tiến độ mỗi 15ph nhé"). Thuần script = 0 token.
  # - Chỉ gửi khi có THAY ĐỔI thật (chữ ký: git hash + file mới + pid đang chạy).
  # - 3 lượt không có gì chạy và không đổi ⇒ gửi 1 tin "xong" rồi tự im (cờ quiet).
  # - Im lặng 22:00–06:00. Hết hạn 20/09 để không thành rác; muốn dùng tiếp thì gia hạn.
  # ⛔ TẮT theo yêu cầu Hoàng sáng 15/09 ("Tiến độ gì thế, bỏ đi được không").
  #    Bật lại: đổi thành enabled: true (chỉ khi Hoàng bảo tiếp tục báo tiến độ widget).
  - id: widget-progress
    enabled: false
    every_minutes: 15
    between: ["07:00", "22:30"]
    until: "2026-09-20"
    script: widget_progress.py

  # Tiến độ 2 run Understand-Anything của dự án vietbank-digital (Hoàng yêu cầu 2026-09-14:
  # "chốt full" → index cả ekyc + vietbank-omni). Thuần script = 0 token, chỉ gửi khi
  # chữ ký tiến độ THẬT SỰ đổi; khi cả 2 run dừng thì gửi 1 tin chốt rồi tự im (cờ quiet).
  # Tự hết hạn 2026-09-21 để không thành rác; muốn dùng tiếp thì gia hạn.
  # ⛔ TẠM DỪNG theo lệnh Hoàng 2026-09-14 ("Tạm hoãn build graph cho tới khi anh nói lại").
  #    Bật lại: đổi thành enabled: true. KHÔNG tự bật lại khi chưa được Hoàng nói.
  - id: ua-progress
    enabled: false
    every_minutes: 15
    between: ["07:00", "22:30"]
    until: "2026-09-21"
    script: ua_progress.py

  # NHẮC HỌP từ Google Calendar của Hoàng (Hoàng chốt 2026-09-14):
  # "em vào calendar của anh để biết anh có những lịch họp nào trong ngày, tới giờ thì nhắc anh họp
  #  (có thể bằng giọng nói trên máy)".
  # - Chỉ nhắc sự kiện HỌP NỘI BỘ / REVIEW TÀI LIỆU DỰ ÁN (loc theo tên + người tham dự @vnpay.vn);
  #   bỏ lịch cá nhân, sự kiện cả ngày, sự kiện đã huỷ.
  # - Nhắc 2 mốc: TRƯỚC 10 PHÚT và ĐÚNG GIỜ bắt đầu → DM Hoàng + đọc to trên loa máy.
  # - Thuần script = 0 token; chống trùng bằng state/calendar_seen.json; im lặng 21:00–07:00.
  # - Token riêng google_calendar_token.json (chỉ quyền đọc lịch), KHÔNG dùng chung token Gmail.
  # - Sửa mốc nhắc / bật-tắt giọng nói: state/calendar_remind.json (không cần sửa code).
  - id: calendar-remind
    every_minutes: 2
    between: ["07:00", "21:30"]
    script: calendar_remind.py

  # Nhắc chị Oanh (PM dự án) việc chị nhờ riêng trong group VBB SME 14/09:
  # "nhắc tui mai gửi source của Hoàng nha". One-shot 09:00 ngày 15/09 → tự hết hạn.
  # Ghi ĐÚNG thứ chị ấy dặn, KHÔNG tự động gửi file/source đi đâu (Ultron chỉ nhắc).
  # Muốn đổi giờ sang 15/09: sửa `when`; bỏ hẳn: enabled -> false.
  - id: oanh-remind-source-hoang
    when: "09:00"
    date: "2026-09-15"
    script: gchat_send_text.py
    args: ["--space", "spaces/AAAADv4ib6s", "--text", "<users/102164964977711619261> Chị Oanh ơi, em nhắc chị việc chị dặn hôm qua nha — món \"source của anh Hoàng\" ấy ạ 👀"]

  # BÁO CÁO NÉN NGỮ CẢNH (Hoàng yêu cầu 2026-09-14: "theo dõi 1 ngày rồi báo anh số thật").
  # Thuần script = 0 token: compact_stats.py đọc agent.log, đếm số lần nén / thời gian / token thu hồi.
  # ⛔ GIẢM TẦN SUẤT 2026-09-15: Hoàng than "báo cáo hoài vậy ta" (đang 2 tin/ngày → thành tiếng ồn
  #    giữa lúc trao đổi). Nay CHỈ gửi 1 lần/tuần, Chủ nhật 09:00, cửa sổ 7 ngày. Bản 18:00 đã bỏ.
  #    Muốn bật lại kiểu cũ: thêm 1 action `when: "18:00"` với args --hours 12.
  #    Muốn "chỉ báo khi có bất thường" (nén lỗi / session sống quá lâu) → cần Jarvis thêm cờ
  #    --only-anomaly cho compact_stats.py (việc code, ~10 phút), chưa làm.
  # Tự hết hạn 2026-09-21; muốn dùng tiếp thì gia hạn `until`.
  - id: compact-report-weekly
    when: "09:00"
    days: [sun]
    until: "2026-09-21"
    script: compact_stats.py
    args: ["--hours", "168", "--send", "--space", "spaces/AAQAZxc2km8"]

  # BÁO TIẾN ĐỘ BUILD GRAPH UA (vietbank-sme) — Hoàng yêu cầu cập nhật tiến độ cho việc chạy nền dài.
  # Thuần script, 0 token: ua_build_progress.py đọc log watcher + log build + artifact .ua/.
  # Mỗi 60 phút; tự im lặng khi build xong (--quiet). Tự hết hạn 2026-09-15.
  - id: ua-build-progress
    enabled: false          # build graph 15/09 đã xong — tắt để khỏi gửi định kỳ; bật lại nếu build lại
    every_minutes: 60
    between: ["23:45", "07:00"]
    until: "2026-09-15"
    script: ua_build_progress.py
    args: ["--send", "--space", "spaces/AAQAZxc2km8", "--quiet"]

  # TICK CRON STORE CỦA PROFILE `jira-runner` (Hoàng chốt 2026-09-16, phương án B).
  # Job `jira-morning-reminder` đã chuyển sang store riêng của profile jira-runner. Gateway đang
  # chạy có gateway.multiplex_profiles=false nên CHỈ tick store của profile default
  # (gateway/run.py:5127-5148: ticker chỉ đi nhiều profile khi multiplex bật) → job kia sẽ không bao
  # giờ tự chạy. jira_runner_tick.py gọi `hermes -p jira-runner cron tick` để bù.
  # Chọn multiplex sẽ phải restart gateway và đổi cách phục vụ bot của MỌI profile → chọn cách này.
  # Chỉ cần tick 1 lần ngay sau 09:00; cửa sổ hẹp cho chắc, tick thừa thì vô hại (job không tới hạn
  # nữa nên script im lặng). 0 token.
  - id: jira-runner-tick
    every_minutes: 2
    between: ["08:58", "09:10"]
    script: jira_runner_tick.py

  # CHECK sau khi job jira-runner đã chạy xong (Hoàng chốt 2026-09-16).
  # 3 điều kiện: (1) `cron doctor` của profile sạch, (2) last_run_at phải là HÔM NAY,
  # (3) lượt chạy cuối phải kết thúc reason=text_response (bắt guardrail_halt / max_iterations...).
  # Đặt 09:15 chứ không nhét vào cửa sổ 08:58-09:10 — check sớm quá sẽ báo động giả trong lúc job
  # còn trong cửa sổ catch-up (~2h). Fail -> exit != 0 -> daily_dispatch.escalate() ghi
  # ~/.hermes/escalations/ -> cron ultron-escalate forward về DM (dedupe 1 lần/ngày). 0 token.
  - id: jira-runner-check
    when: "09:15"
    script: jira_runner_tick.py
    args: ["--check"]
