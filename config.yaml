model:
  default: deepseek-v4-pro
  provider: custom
  base_url: https://api-llm.x.vnshop.cloud/v1
  api_key: ${HERMES_CUSTOM_API_LLM_X_VNSHOP_CLOUD_API_KEY}
  api_mode: chat_completions
database:
  journal_mode: wal
runtime:
  nofile_soft_limit: 4096
agent:
  max_turns: 500
  service_tier: ''
  fast_auto_seconds: 60
  verbose: false
  reasoning_effort: medium
  personalities: {}
terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
browser:
  inactivity_timeout: 120
  extension_control:
    enabled: false
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  non_interactive_hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  checkpoint_required: false
  progress_notices: false
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  min_tail_user_messages: 1
  max_attempts: 3
  proactive_prune_tokens: 0
  proactive_prune_min_result_chars: 8000
  proactive_prune_min_reclaim_tokens: 4096
  hygiene_max_turn_hold_seconds: 10
  protect_first_n: 3
  codex_gpt55_autoraise: true
  codex_app_server_auto: native
  codex_responses_native: false
  idle_compact_after_seconds: 0
prompt_caching:
  cache_ttl: 5m
display:
  compact: false
  busy_input_mode: interrupt
  bell_on_complete: false
  bell_on_prompt: false
  show_reasoning: false
  background_process_notifications: concise
  streaming: true
  skin: default
  interim_assistant_messages: true
  tool_progress: all
  cleanup_progress: false
  long_running_notifications: true
  busy_ack_detail: true
stt:
  enabled: true
  language: en
  local:
    model: base
  openai:
    model: whisper-1
    language: ''
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
delegation:
  max_iterations: 250
skills:
  creation_nudge_interval: 15
kanban:
  review_dispatch: true
code_execution:
  timeout: 300
  max_tool_calls: 50
gateway:
  signal_interrupt_grace_timeout: 1
  delivery_ledger: true
  platform_connect_timeout: 30
  loop_watchdog: true
  loop_watchdog_probe_interval_s: 30.0
  loop_watchdog_probe_timeout_s: 10.0
  loop_watchdog_max_strikes: 3
  startup_watchdog: true
  startup_watchdog_timeout_seconds: 300
  write_sessions_json: true
  scale_to_zero:
    idle_timeout_minutes: 2
  restart_loop_guard:
    max_restarts: 3
    window_seconds: 60
    max_gap_seconds: 300
  respawn_storm:
    max_starts: 5
    window_seconds: 120
  message_timestamps:
    enabled: false
  max_inbound_media_bytes: 134217728
  trust_env: true
  strict: false
  media_delivery_allow_dirs: []
  trust_recent_files: true
  trust_recent_files_seconds: 600
  api_server:
    max_concurrent_runs: 10
streaming:
  enabled: false
telemetry:
  shared_metrics:
    enabled: false
    send: false
updates:
  check: true
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
_config_version: 41
group_sessions_per_user: true
platform_toolsets:
  cli:
    - hermes-cli
  telegram:
    - hermes-telegram
  discord:
    - hermes-discord
  whatsapp:
    - hermes-whatsapp
  slack:
    - hermes-slack
  signal:
    - hermes-signal
  homeassistant:
    - hermes-homeassistant
  qqbot:
    - hermes-qqbot
  yuanbao:
    - hermes-yuanbao
  teams:
    - hermes-teams
  google_chat:
    - hermes-google_chat
custom_providers:
  - name: VNPay LLM Gateway
    base_url: https://api-llm.x.vnshop.cloud/v1
    key_env: HERMES_CUSTOM_API_LLM_X_VNSHOP_CLOUD_API_KEY
    model: deepseek-v4-pro
    api_mode: chat_completions
    models:
      deepseek-v4-pro:
        context_length: 1000000
onboarding:
  seen:
    busy_input_prompt: true
    tool_progress_prompt: true
mcp_servers:
  db-access:
    url: http://127.0.0.1:8443/mcp
    headers:
      x-api-key: ${MCP_DB_ACCESS_API_KEY}
  atlassian:
    command: uvx
    args:
      - --python=3.12
      - mcp-atlassian
    env:
      CONFLUENCE_URL: https://wiki.servicehub.vn
      CONFLUENCE_USERNAME: hoangnlv@vnpay.vn
      CONFLUENCE_PERSONAL_TOKEN: ${MCP_ATLASSIAN_CONFLUENCE_TOKEN}
      JIRA_URL: https://jr.servicehub.vn/
      JIRA_USERNAME: hoangnlv@vnpay.vn
      JIRA_PERSONAL_TOKEN: ${MCP_ATLASSIAN_JIRA_TOKEN}
    tools:
      exclude:
        - confluence_add_label
        - confluence_create_page
        - confluence_update_page
        - confluence_delete_page
        - confluence_move_page
        - confluence_add_comment
        - confluence_get_page_history
        - confluence_search_user
        - confluence_upload_attachment
        - confluence_upload_attachments
        - confluence_get_attachments
        - confluence_download_attachment
        - confluence_download_content_attachments
        - confluence_get_page_images
        - confluence_delete_attachment
        - confluence_reply_to_comment
        - confluence_get_labels
